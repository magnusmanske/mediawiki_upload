[package]
name = "mediawiki_upload"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Upload files to a MediaWiki wiki through its Action API"
keywords = ["mediawiki", "wikimedia", "upload", "oauth"]
categories = ["api-bindings", "web-programming"]

[dependencies]
base64 = "0.22"
hmac = "0.12"
reqwest = { version = "0.13", features = ["form", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
url = "2"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
